<!-- public/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WhatsApp Bot Pairing</title>
  <style>
    body {
      background: #121212;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 60px;
    }
    h1 {
      color: #25D366;
    }
    input, button {
      padding: 10px;
      font-size: 16px;
      margin-top: 15px;
      border-radius: 5px;
      border: none;
    }
    input {
      width: 200px;
    }
    button {
      background-color: #25D366;
      color: white;
      cursor: pointer;
    }
    #result {
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <h1>Link Your WhatsApp Bot</h1>
  <input type="text" id="codeInput" placeholder="Enter Pairing Code" />
  <button onclick="submitCode()">Link</button>
  <div id="result"></div>

  <script>
    async function submitCode() {
      const code = document.getElementById('codeInput').value;
      const response = await fetch('/pair', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code })
      });

      const result = await response.json();
      const div = document.getElementById('result');
      if (response.ok) {
        div.innerHTML = `Bot Linked! Session ID: <b>${result.sessionId}</b>`;
      } else {
        div.innerHTML = `Error: ${result.error}`;
      }
    }
  </script>
</body>
</html>
